<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11膠囊旅館預約住宿系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-done {
            background-color: #f3f4f6;
            color: #9ca3af;
            text-decoration: line-through;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">11膠囊旅館預約住宿系統</h1>
            <p class="text-gray-600 mt-2">Capsule Hotel Booking System</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-semibold mb-4 text-gray-700">新增入住預約</h2>
                    <form id="bookingForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600">姓名</label>
                            <input type="text" name="field1" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">證件號碼 (護照)</label>
                            <input type="text" name="field2" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">入住時間</label>
                            <input type="datetime-local" name="field3" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">入住房型</label>
                            <select name="field4" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="標準單人艙">標準單人艙</option>
                                <option value="豪華單人艙">豪華單人艙</option>
                                <option value="商務雙人艙">商務雙人艙</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">聯絡號碼</label>
                            <input type="tel" name="field5" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">國籍</label>
                            <input type="text" name="field7" required placeholder="例如：中國、馬來西亞" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">備註</label>
                            <textarea name="field6" rows="3" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                            立即預約
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="flex border-b">
                        <button onclick="changeFilter('all')" id="tab-all" class="px-6 py-3 font-medium text-sm tab-active">全部</button>
                        <button onclick="changeFilter('active')" id="tab-active" class="px-6 py-3 font-medium text-sm text-gray-500">Active</button>
                        <button onclick="changeFilter('done')" id="tab-done" class="px-6 py-3 font-medium text-sm text-gray-500">已上載</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">狀態</th>
                                    <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">預約人資訊</th>
                                    <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">入住時間 (北京時間)</th>
                                    <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">房型</th>
                                    <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="bookingTableBody" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                    <div id="emptyState" class="hidden p-10 text-center text-gray-400">目前沒有預約資料</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3cJsvzd-lK3AwQL4Dfa-gwW15tQSOTuHpGm_AReh171AphS50W-IszxXLpNH7kt7G3Q/exec";
        let currentFilter = 'all';

        // --- Backend Connectors ---

        async function syncToSheet(payload) {
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors", // GAS 限制通常需要 no-cors 或透過特定方式處理，但 POST 常見做法如下
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                console.log("Sync success:", payload.action);
            } catch (err) {
                console.error("Sync failed:", err);
            }
        }

        async function fetchRecordsFromSheet() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.ok) {
                    return data.records.map(normalizeRecord);
                }
                return null;
            } catch (err) {
                console.error("Fetch Sheet failed:", err);
                return null;
            }
        }

        function normalizeRecord(record) {
            // 將 Sheet Header 對應回前端使用的 Key
            return {
                id: record.ID || record.id,
                createdAt: record.CreatedAt || record.createdAt,
                status: record.Status || record.status,
                field1: record.field1,
                field2: record.field2,
                field3: record.field3,
                field4: record.field4,
                field5: record.field5,
                field6: record.field6,
                field7: record.field7
            };
        }

        // --- Core Functions ---

        async function loadData() {
            // 優先讀取雲端
            const sheetData = await fetchRecordsFromSheet();
            if (sheetData) {
                localStorage.setItem('records', JSON.stringify(sheetData));
                return sheetData;
            }
            // Fallback 到本地
            const localData = localStorage.getItem('records');
            return localData ? JSON.parse(localData) : [];
        }

        function saveData(records) {
            localStorage.setItem('records', JSON.stringify(records));
            // 這裡不再呼叫 applyFilterAndRender，因為 async 流程由 caller 控制
        }

        async function createRecord(formData) {
            const records = JSON.parse(localStorage.getItem('records') || "[]");
            const newRecord = {
                id: Date.now(),
                createdAt: new Date().toISOString(),
                status: 'active',
                field1: formData.get('field1'),
                field2: formData.get('field2'),
                field3: formData.get('field3'),
                field4: formData.get('field4'),
                field5: formData.get('field5'),
                field6: formData.get('field6'),
                field7: formData.get('field7')
            };
            
            records.push(newRecord);
            saveData(records);
            
            // 同步到雲端
            await syncToSheet({ action: "create", record: newRecord });
            await applyFilterAndRender();
        }

        async function updateRecord(id, changes) {
            let records = JSON.parse(localStorage.getItem('records') || "[]");
            if (changes === null) {
                records = records.filter(r => r.id !== id);
                // 注意：你的 GAS 目前可能不支援刪除，此處僅處理本地
            } else {
                records = records.map(r => r.id === id ? { ...r, ...changes } : r);
                // 同步更新到雲端
                await syncToSheet({ action: "update", id: id, changes: changes });
            }
            saveData(records);
            await applyFilterAndRender();
        }

        function renderList(recordsToShow) {
            const tableBody = document.getElementById('bookingTableBody');
            const emptyState = document.getElementById('emptyState');
            tableBody.innerHTML = '';

            if (recordsToShow.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            recordsToShow.forEach(item => {
                const isDone = item.status === 'done';
                const row = document.createElement('tr');
                row.className = `hover:bg-gray-50 transition-colors ${isDone ? 'status-done' : ''}`;
                
                row.innerHTML = `
                    <td class="px-4 py-4">
                        <span class="px-2 py-1 text-xs rounded-full ${isDone ? 'bg-gray-200 text-gray-500' : 'bg-green-100 text-green-700'}">
                            ${isDone ? '已上載' : 'Active'}
                        </span>
                    </td>
                    <td class="px-4 py-4">
                        <div class="font-medium text-gray-900">${item.field1} (${item.field7 || '未註明'})</div>
                        <div class="text-xs text-gray-500">證件：${item.field2}</div>
                        <div class="text-xs text-gray-400">電話：${item.field5}</div>
                    </td>
                    <td class="px-4 py-4 text-sm text-gray-600 font-mono">
                        ${String(item.field3).replace('T', ' ')}
                    </td>
                    <td class="px-4 py-4 text-sm text-gray-600">
                        ${item.field4}
                    </td>
                    <td class="px-4 py-4 text-sm space-x-2">
                        <button onclick="handleStatusToggle(${item.id}, '${item.status}')" class="text-blue-600 hover:text-blue-800 font-medium">
                            ${isDone ? '重啟' : '完成'}
                        </button>
                        <button onclick="handleDelete(${item.id})" class="text-red-500 hover:text-red-700">刪除</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function applyFilterAndRender() {
            const allRecords = await loadData();
            const filtered = allRecords.filter(r => {
                if (currentFilter === 'all') return true;
                return r.status === currentFilter;
            });
            renderList(filtered);
            updateTabs();
        }

        function updateTabs() {
            ['all', 'active', 'done'].forEach(f => {
                const tab = document.getElementById(`tab-${f}`);
                if (tab) {
                    if (f === currentFilter) {
                        tab.classList.add('tab-active');
                        tab.classList.remove('text-gray-500');
                    } else {
                        tab.classList.remove('tab-active');
                        tab.classList.add('text-gray-500');
                    }
                }
            });
        }

        function changeFilter(filter) {
            currentFilter = filter;
            applyFilterAndRender();
        }

        async function handleStatusToggle(id, currentStatus) {
            const nextStatus = currentStatus === 'active' ? 'done' : 'active';
            await updateRecord(id, { status: nextStatus });
        }

        async function handleDelete(id) {
            if (confirm('確定要刪除此預約？')) {
                await updateRecord(id, null);
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "上傳中...";
            
            const formData = new FormData(this);
            await createRecord(formData);
            
            this.reset();
            btn.disabled = false;
            btn.innerText = "立即預約";
        });

        window.onload = applyFilterAndRender;
    </script>
</body>
</html>
